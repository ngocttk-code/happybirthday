<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chúc Mừng Sinh Nhật Kim Ngân 🎉🎂</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b021a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            touch-action: none;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(251, 191, 36, 0.3);
            box-shadow: 0 8px 32px 0 rgba(245, 158, 11, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:hover, .glass-btn:active {
            background: rgba(245, 158, 11, 0.25);
            border-color: rgba(251, 191, 36, 0.7);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.6);
            transform: scale(1.05);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(251,191,36,0.8) 0%, rgba(244,114,182,0.3) 60%, rgba(0,0,0,0) 100%);
            transform: scale(0);
            animation: ripple-animation 0.8s ease-out;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .tap-hint {
            animation: pulse-glow 3s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-4px); }
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex items-center justify-center">

    <!-- 3D WebGL Canvas Layer -->
    <div id="canvas-container"></div>

    <!-- Floating Audio Control -->
    <header class="fixed top-5 right-5 z-20 flex items-center gap-3">
        <button id="audio-toggle" class="glass-btn p-3.5 sm:p-4 rounded-full text-amber-300 flex items-center justify-center group focus:outline-none" title="Bật/Tắt Nhạc Sinh Nhật">
            <i id="audio-icon" class="fas fa-compact-disc text-lg sm:text-xl group-hover:rotate-12 transition-transform"></i>
            <span class="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-500 ease-in-out whitespace-nowrap text-xs font-medium ml-0 group-hover:ml-2 text-amber-200">
                Nhạc Sinh Nhật
            </span>
        </button>
    </header>

    <!-- On-screen Interactive Hint -->
    <div id="start-hint" style="left: 40%;" class="fixed bottom-6 -translate-x-1/2 z-20 text-center pointer-events-none tap-hint">
        <p class="text-xs sm:text-sm font-light text-amber-200/90 tracking-widest uppercase flex items-center gap-2 drop-shadow">
            <i class="fas fa-gift text-amber-400"></i> Chạm màn hình để bật nhạc & bắn pháo hoa 🎉
        </p>
    </div>

    <script>
        class HappyBirthdaySynth {
            constructor() {
                this.audioCtx = null;
                this.isPlaying = false;
                this.timer = null;
                
                // Happy Birthday melody notes & durations
                this.notes = [
                    { f: 264, d: 1 }, { f: 264, d: 1 }, { f: 297, d: 2 }, { f: 264, d: 2 }, { f: 352, d: 2 }, { f: 330, d: 4 },
                    { f: 264, d: 1 }, { f: 264, d: 1 }, { f: 297, d: 2 }, { f: 264, d: 2 }, { f: 396, d: 2 }, { f: 352, d: 4 },
                    { f: 264, d: 1 }, { f: 264, d: 1 }, { f: 528, d: 2 }, { f: 440, d: 2 }, { f: 352, d: 2 }, { f: 330, d: 2 }, { f: 297, d: 4 },
                    { f: 466, d: 1 }, { f: 466, d: 1 }, { f: 440, d: 2 }, { f: 352, d: 2 }, { f: 396, d: 2 }, { f: 352, d: 4 }
                ];
                this.step = 0;
            }

            init() {
                if (!this.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.audioCtx = new AudioContext();
                }
            }

            playNextNote() {
                if (!this.isPlaying || !this.audioCtx) return;

                const note = this.notes[this.step % this.notes.length];
                this.step++;

                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(note.f * 1.5, this.audioCtx.currentTime);

                const now = this.audioCtx.currentTime;
                const noteDuration = note.d * 0.28;

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(0.15, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + noteDuration + 0.8);

                osc.connect(gain);
                gain.connect(this.audioCtx.destination);

                osc.start(now);
                osc.stop(now + noteDuration + 0.9);

                this.timer = setTimeout(() => this.playNextNote(), noteDuration * 1000);
            }

            toggle() {
                this.init();
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }

                this.isPlaying = !this.isPlaying;
                if (this.isPlaying) {
                    this.playNextNote();
                } else {
                    clearTimeout(this.timer);
                }
                return this.isPlaying;
            }

            startOnFirstTouch() {
                if (!this.isPlaying) {
                    this.toggle();
                    return true;
                }
                return false;
            }
        }

        const musicSynth = new HappyBirthdaySynth();

        function createBirthdaySpriteTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (type === 'cake') {
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 18;
                
                ctx.fillStyle = '#f472b6';
                ctx.fillRect(34, 60, 60, 40);
                ctx.fillStyle = '#fbcfe8';
                ctx.fillRect(42, 40, 44, 20);

                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(52, 22, 6, 18);
                ctx.fillRect(70, 22, 6, 18);

                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(55, 18, 4, 0, Math.PI * 2);
                ctx.arc(73, 18, 4, 0, Math.PI * 2);
                ctx.fill();

            } else if (type === 'gift') {
                ctx.shadowColor = '#ec4899';
                ctx.shadowBlur = 18;

                ctx.fillStyle = '#8b5cf6';
                ctx.fillRect(34, 44, 60, 52);

                ctx.fillStyle = '#a78bfa';
                ctx.fillRect(28, 34, 72, 14);

                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(58, 34, 12, 62);
                ctx.fillRect(34, 64, 60, 12);

            } else if (type === 'hat') {
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 18;

                ctx.fillStyle = '#ec4899';
                ctx.beginPath();
                ctx.moveTo(64, 20);
                ctx.lineTo(30, 95);
                ctx.lineTo(98, 95);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(48, 55); ctx.lineTo(80, 55);
                ctx.moveTo(38, 78); ctx.lineTo(90, 78);
                ctx.stroke();

                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(64, 18, 8, 0, Math.PI * 2);
                ctx.fill();

            } else if (type === 'balloon') {
                ctx.shadowColor = '#3b82f6';
                ctx.shadowBlur = 18;

                const colors = ['#f43f5e', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'];
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                
                ctx.beginPath();
                ctx.ellipse(64, 52, 28, 36, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(52, 40, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#d1d5db';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(64, 88);
                ctx.quadraticCurveTo(60, 102, 68, 116);
                ctx.stroke();

            } else if (type === 'star') {
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 20;

                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                const cx = 64, cy = 64, spikes = 5, outerRadius = 38, innerRadius = 16;
                let rot = Math.PI / 2 * 3;
                let x = cx, y = cy;
                const step = Math.PI / spikes;

                ctx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    x = cx + Math.cos(rot) * outerRadius;
                    y = cy + Math.sin(rot) * outerRadius;
                    ctx.lineTo(x, y);
                    rot += step;

                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                }
                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // Hàm tạo texture chữ đơn sắc màu trắng
        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 1024;
            canvas.height = 256;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Bóng phát sáng nhẹ màu trắng
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 12;

            // Màu chữ trắng thuần 100%
            ctx.fillStyle = '#ffffff';
            ctx.font = 'Bold 42px "Plus Jakarta Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        let scene, camera, renderer;
        let rainGroup, floatingParticlesGroup;
        const textSprites = [];
        const particleSprites = [];

        const birthdayPhrases = [
            "Happy Birthday!🎂",
            "Trần Thị Kim Ngân✨"
            
        ];

        function init3D() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b021a, 0.011);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            adjustCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffedd5, 1.3);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xf59e0b, 2.5, 100);
            pointLight.position.set(0, 10, 20);
            scene.add(pointLight);

            rainGroup = new THREE.Group();
            floatingParticlesGroup = new THREE.Group();
            scene.add(rainGroup);
            scene.add(floatingParticlesGroup);

            spawnBirthdayParticles();
            spawn3DTextRain();

            window.addEventListener('resize', onWindowResize);
            setupInteractiveControls();
        }

        function adjustCameraPosition() {
            const isMobile = window.innerWidth < 768;
            camera.position.z = isMobile ? 45 : 35;
            camera.position.y = 0;
            camera.lookAt(scene.position);
        }

        function spawnBirthdayParticles() {
            const isMobile = window.innerWidth < 768;
            const particleCount = isMobile ? 120 : 220;

            const spriteTypes = ['cake', 'gift', 'hat', 'balloon', 'star'];
            const textures = {};
            spriteTypes.forEach(t => textures[t] = createBirthdaySpriteTexture(t));

            for (let i = 0; i < particleCount; i++) {
                const type = spriteTypes[i % spriteTypes.length];
                const texture = textures[type];

                const material = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    opacity: Math.random() * 0.75 + 0.25,
                    blending: THREE.AdditiveBlending
                });

                const sprite = new THREE.Sprite(material);

                sprite.position.x = (Math.random() - 0.5) * 160;
                sprite.position.y = (Math.random() - 0.5) * 160;
                sprite.position.z = (Math.random() - 0.5) * 120;

                const scaleFactor = (type === 'star') ? 1.2 : 1.8;
                const baseSize = (Math.random() * 1.4 + 0.8) * scaleFactor * (isMobile ? 1.0 : 1.3);
                sprite.scale.set(baseSize, baseSize, 1);

                sprite.userData = {
                    speedY: Math.random() * 0.08 + 0.03,
                    swaySpeed: Math.random() * 0.02 + 0.01,
                    swayAmount: Math.random() * 0.06 + 0.02,
                    initialX: sprite.position.x,
                    phase: Math.random() * Math.PI * 2
                };

                floatingParticlesGroup.add(sprite);
                particleSprites.push(sprite);
            }
        }

        function spawn3DTextRain() {
            const isMobile = window.innerWidth < 768;
            const streamCount = isMobile ? 45 : 75;

            for (let i = 0; i < streamCount; i++) {
                const phrase = birthdayPhrases[i % birthdayPhrases.length];
                const texture = createTextTexture(phrase);

                const material = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    opacity: Math.random() * 0.65 + 0.35,
                    blending: THREE.AdditiveBlending
                });

                const sprite = new THREE.Sprite(material);

                const xSpan = isMobile ? 42 : 85;
                sprite.position.x = (Math.random() - 0.5) * xSpan;
                sprite.position.y = Math.random() * 100 - 50;
                sprite.position.z = (Math.random() - 0.5) * 60;

                const scaleBase = isMobile ? 3.4 : 4.6;
                const randomScale = (Math.random() * 0.8 + 0.8) * scaleBase;
                sprite.scale.set(randomScale * 3.5, randomScale * 0.875, 1);

                sprite.userData = {
                    speed: Math.random() * 0.07 + 0.035,
                    resetY: 50 + Math.random() * 20,
                    bottomY: -50 - Math.random() * 10,
                    phraseIndex: i % birthdayPhrases.length
                };

                rainGroup.add(sprite);
                textSprites.push(sprite);
            }
        }

        function setupInteractiveControls() {
            const audioToggleBtn = document.getElementById('audio-toggle');
            const audioIcon = document.getElementById('audio-icon');
            const startHint = document.getElementById('start-hint');

            audioToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isPlaying = musicSynth.toggle();
                updateAudioUI(isPlaying);
            });

            function updateAudioUI(isPlaying) {
                if (isPlaying) {
                    audioIcon.className = "fas fa-compact-disc text-lg sm:text-xl text-amber-400 animate-spin";
                    if (startHint) startHint.style.opacity = '0';
                } else {
                    audioIcon.className = "fas fa-compact-disc text-lg sm:text-xl";
                }
            }

            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('#audio-toggle')) return;

                if (!musicSynth.isPlaying) {
                    const started = musicSynth.startOnFirstTouch();
                    if (started) updateAudioUI(true);
                }

                createRipple(e.clientX, e.clientY);
                create3DFireworksBurst(e.clientX, e.clientY);
            });

            window.addEventListener('pointermove', (e) => {
                const mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                const mouseY = (e.clientY / window.innerHeight - 0.5) * 2;

                camera.position.x += (mouseX * 3.5 - camera.position.x) * 0.04;
                camera.position.y += (-mouseY * 3.5 - camera.position.y) * 0.04;
                camera.lookAt(scene.position);
            });
        }

        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            const size = Math.max(window.innerWidth, window.innerHeight) * 0.15;
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${x - size / 2}px`;
            ripple.style.top = `${y - size / 2}px`;

            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);
        }

        function create3DFireworksBurst(clientX, clientY) {
            const vec = new THREE.Vector3(
                (clientX / window.innerWidth) * 2 - 1,
                -(clientY / window.innerHeight) * 2 + 1,
                0.5
            );
            vec.unproject(camera);
            const dir = vec.sub(camera.position).normalize();
            const distance = (10 - camera.position.z) / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));

            const starTexture = createBirthdaySpriteTexture('star');
            const burstCount = 22;

            for (let i = 0; i < burstCount; i++) {
                const material = new THREE.SpriteMaterial({
                    map: starTexture,
                    transparent: true,
                    opacity: 1,
                    blending: THREE.AdditiveBlending
                });

                const starSprite = new THREE.Sprite(material);
                starSprite.position.copy(pos);
                
                const scale = Math.random() * 1.6 + 1.2;
                starSprite.scale.set(scale, scale, 1);

                const vx = (Math.random() - 0.5) * 0.45;
                const vy = (Math.random() - 0.5) * 0.45 + 0.1;
                const vz = (Math.random() - 0.5) * 0.45;

                scene.add(starSprite);

                let life = 1.0;
                const interval = setInterval(() => {
                    life -= 0.035;
                    starSprite.material.opacity = life;
                    starSprite.position.x += vx;
                    starSprite.position.y += vy;
                    starSprite.position.z += vz;

                    if (life <= 0) {
                        clearInterval(interval);
                        scene.remove(starSprite);
                    }
                }, 16);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            adjustCameraPosition();
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            particleSprites.forEach(p => {
                p.position.y -= p.userData.speedY;

                p.userData.phase += p.userData.swaySpeed;
                p.position.x = p.userData.initialX + Math.sin(p.userData.phase) * 2.2;

                if (p.position.y < -70) {
                    p.position.y = 70 + Math.random() * 20;
                    p.position.x = (Math.random() - 0.5) * 160;
                    p.userData.initialX = p.position.x;
                }
            });

            textSprites.forEach(sprite => {
                sprite.position.y -= sprite.userData.speed;

                if (sprite.position.y < sprite.userData.bottomY) {
                    sprite.position.y = sprite.userData.resetY;
                    const isMobile = window.innerWidth < 768;
                    const xSpan = isMobile ? 42 : 85;
                    sprite.position.x = (Math.random() - 0.5) * xSpan;

                    sprite.userData.phraseIndex = (sprite.userData.phraseIndex + 1) % birthdayPhrases.length;
                    const nextPhrase = birthdayPhrases[sprite.userData.phraseIndex];
                    sprite.material.map = createTextTexture(nextPhrase);
                }
            });

            renderer.render(scene, camera);
        }

        window.onload = function() {
            init3D();
            animate();
        };
    </script>
</body>
</html>
